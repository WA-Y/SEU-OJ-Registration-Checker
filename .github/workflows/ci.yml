name: Python 语法检查

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（编译所有 .py 文件）
        run: |
          python -m py_compile src/*.py run.py

      - name: 导入冒烟测试（验证模块可正常导入）
        run: |
          cd src && python -c "import config, excel_reader, matcher, oierdb_fetcher, output, state, server; print('所有模块导入成功')"
